    const fmt = d => `${iso(d)}T${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}:00`;
    try {
      const r = await mcp.callTool("Google Calendar", "create_event", { summary: `${TRIP_TYPES[t.type]} charter${t.customer ? " · " + t.customer : ""}`, startTime: fmt(start), endTime: fmt(end), location: settings.homePort || "",
        description: [t.party ? `${t.party} anglers` : "", t.phone ? `Phone: ${t.phone}` : "", t.email ? `Email: ${t.email}` : "", t.fee ? `Fee: ${money(+t.fee)}` : "", t.deposit ? `Deposit: ${money(+t.deposit)}` : "", t.notes].filter(Boolean).join("\n") }, { cache: false });
      const evId = r.payload?.id || r.payload?.eventId || "added";
      await db.collection("trips").doc(id).update({ calEventId: evId });
      mcp.invalidate("Google Calendar").catch(() => {});
      toast("Added to Google Calendar"); dlg.close();
    } catch (e) { showErr(e?.code === "tool_error" ? "Google Calendar couldn't add the event." : e?.code ? connMsg("Google Calendar", e.code) : writeErr(e)); if (btn) { btn.disabled = false; btn.textContent = "Add to Google Calendar"; } }
  }

  // ================= Ask Claude =================
  function businessSnapshot() {
    const t = today(); const months = [];
    for (let i = 11; i >= 0; i--) {
      const s = new Date(t.getFullYear(), t.getMonth() - i, 1), e = new Date(t.getFullYear(), t.getMonth() - i + 1, 0);
      const c = compute({ start: s, end: e < t ? e : t });
      months.push({ month: iso(s).slice(0, 7), income: Math.round(c.income), expenses: Math.round(c.expTotal), profit: Math.round(c.net), halfDayTrips: c.types.half.n, fullDayTrips: c.types.full.n, cancellations: c.canc.length, expensesByCategory: Object.fromEntries(Object.entries(c.byCat).map(([k, v]) => [catName(k), Math.round(v)])) });
    }
    const tc = taxCalc(t.getFullYear());
    return {
      today: iso(t), business: settings.name, prices: { halfDay: settings.halfPrice, fullDay: settings.fullPrice },
      last12Months: months,
      upcomingBookings: trips.filter(x => x.status === "booked" && x.date >= iso(t)).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 20).map(x => ({ date: x.date, type: x.type, customer: x.customer, fee: x.fee })),
      taxes: { year: tc.year, netProfitYTD: Math.round(tc.net), estimatedTaxYTD: Math.round(tc.total), projectedYearTax: Math.round(tc.projected), paidSoFar: Math.round(tc.paidTotal), quarters: tc.quarters.map(q => ({ q: q.q, due: q.due, suggested: Math.round(q.suggested), paid: Math.round(q.paid), status: q.status })) },
      maintenance: service.map(s => ({ name: s.name, ...serviceStatus(s) })), renewals: renewals.map(r => ({ name: r.name, due: r.due || null })),
      engineHours: engineNow(), topCustomers: customerList().slice(0, 10).map(c => ({ name: c.name, trips: c.trips.length, spent: Math.round(c.spent) })),
      includesExampleData: trips.some(x => x.example) || ledger.some(x => x.example),
    };
  }
  async function ask() {
    const q = (v("#askQ") || askS.q).trim(); if (!q || !sample) return;
    askS.q = q; askS.a = ""; askS.err = ""; askS.busy = true; render(true);
    const prompt = `You are a practical business advisor for a small fishing charter business, talking to the captain. Answer their question using only the data below. Be specific with numbers, keep it short (under 200 words), use plain text with simple dashes for lists, and no markdown headings or tables. If the data can't answer it, say what they'd need to log. For tax questions, give the estimate and remind them to confirm with an accountant.

Business data (JSON):
${JSON.stringify(businessSnapshot())}

Question: ${q}`;
    try {
      const r = await sample(prompt, { onText: ({ text }) => { askS.a = text; const el = $("#askOut"); if (el) el.textContent = text; } });
      askS.a = r.text;
    } catch (e) { askS.err = e?.code === "not_granted" ? "Asking Claude isn't allowed in this view." : e?.code === "rate_limited" ? "Too many questions just now. Try again in a minute." : "Couldn't get an answer. Try again."; }
    askS.busy = false; render(true);
  }

  // ================= events =================
  document.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const d = b.dataset;
    if (d.tab) { tab = d.tab; if (tab !== "inbox") { mail.open = null; mail.compose = null; } if (tab !== "customers") custSel = null; render(true); window.scrollTo(0, 0); }
    else if (d.period) { period = d.period; render(true); }
    else if (d.tripfilter) { tripFilter = d.tripfilter; render(true); }
    else if (d.ledgerfilter) { ledgerFilter = d.ledgerfilter; render(true); }
    else if (d.mailfilter) { mail.filter = d.mailfilter; render(true); }
    else if (d.taxyear) { taxYear = +d.taxyear; render(true); }
    else if (d.cal) { calMonth = d.cal === "0" ? new Date(today().getFullYear(), today().getMonth(), 1) : new Date(calMonth.getFullYear(), calMonth.getMonth() + +d.cal, 1); if (d.cal === "0") calSel = iso(today()); render(true); }
    else if (d.day) { calSel = calSel === d.day ? null : d.day; render(true); }
    else if (d.newTripOn) openTrip(null, { date: d.newTripOn, status: d.newTripOn > iso(today()) ? "booked" : "completed" });
    else if (d.cust !== undefined) { custSel = d.cust || null; render(true); window.scrollTo(0, 0); }
    else if (d.composeTo) { tab = "inbox"; mail.open = null; mail.compose = { to: d.composeTo, subject: "", body: `Hi ${(d.composeName || "").split(" ")[0]},\n\n` }; render(true); window.scrollTo(0, 0); }
    else if (d.copy) { navigator.clipboard?.writeText(d.copy).then(() => toast("Copied"), () => toast(d.copy)); }
    else if (b.id === "addTripBtn") openTrip();
    else if (b.id === "addExpBtn") openLedger();
    else if (d.editTrip && canWrite) openTrip(trips.find(t => t.id === d.editTrip));
    else if (d.editLedger && canWrite) openLedger(ledger.find(x => x.id === d.editLedger));
    else if (d.editRenewal && canWrite) openRenewal(renewals.find(x => x.id === d.editRenewal));
    else if (d.editService && canWrite) openService(service.find(x => x.id === d.editService));
    else if (d.editMiles && canWrite) openMiles(miles.find(x => x.id === d.editMiles));
    else if (d.serviceDone) serviceDone(d.serviceDone);
    else if (d.payQ) openTaxPay(+d.payQ);
    else if (d.openThread) openThread(d.openThread);
    else if (d.ask) { askS.q = d.ask; const el = $("#askQ"); if (el) el.value = d.ask; ask(); }
    else if (d.del) delEntry(d.del);
    else switch (d.act) {
      case "close": dlg.close(); break;
      case "clear-ex": clearExamples(b); break;
      case "export": exportCsv(); break;
      case "ask": ask(); break;
      case "add-income": openLedger(null, "income"); break;
      case "add-maint": openLedger(null, "expense", "maintenance"); break;
      case "add-renewal": openRenewal(); break;
      case "add-service": openService(); break;
      case "add-miles": openMiles(); break;
      case "engine": openEngine(); break;
      case "connect-mail": connect("mail"); break;
      case "connect-cal": connect("cal"); break;
      case "refresh-mail": mcp?.invalidate("Gmail").catch(() => {}); toast("Checking for new email…"); break;
      case "close-thread": mail.open = null; render(true); break;
      case "ai-draft": aiDraft(); break;
      case "blank-draft": mail.open.draft = { to: replyTarget(), body: "", busy: false, err: "", saved: false }; render(true); break;
      case "save-draft": saveDraft(); break;
      case "send-reply": sendReply(); break;
      case "compose": mail.open = null; mail.compose = { to: "", subject: "", body: "" }; render(true); window.scrollTo(0, 0); break;
      case "close-compose": mail.compose = null; render(true); break;
      case "send-compose": sendCompose(false); break;
      case "draft-compose": sendCompose(true); break;
      case "trip-to-cal": tripToCalendar(); break;
      case "book-from-mail": { const p = bookingFromOpen(); openTrip(null, { status: "booked", date: p.date || iso(today()), time: p.time || "07:00", type: p.type, fee: p.fee || (p.type === "full" ? settings.fullPrice : settings.halfPrice), hours: p.type === "full" ? 8 : 4, customer: p.customer, email: p.email, phone: p.phone, party: p.party, notes: "From email: " + (mail.open.msgs[0]?.subject || ""), emailThreadId: mail.open.id }); break; }
    }
  });
  document.addEventListener("submit", async e => {
    e.preventDefault();
    if (e.target.id === "dlgForm") return submitForm();
    if (e.target.id !== "setForm") return;
    const f = new FormData(e.target);
    const body = { ...settings, name: String(f.get("name") || "").trim(), halfPrice: +f.get("halfPrice") || 0, fullPrice: +f.get("fullPrice") || 0, homePort: String(f.get("homePort") || "").trim(),
      incomeRate: Math.min(40, Math.max(0, +f.get("incomeRate") || 0)), stateRate: Math.min(15, Math.max(0, +f.get("stateRate") || 0)), mileRate: Math.max(0, +f.get("mileRate") || 0) };
    try { await db.doc("settings/main").set(body); toast("Settings saved"); } catch (err) { toast(writeErr(err)); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "askQ" && !e.shiftKey) { e.preventDefault(); ask(); } });

  // ================= boot =================
  render(true);
  (async () => {
    db = await window.claude?.use?.("db") ?? null;
    if (!db) { note = "Open this page while signed in to claude.ai to save and see entries."; render(true); return; }
    const user = await window.claude.use("user");
    if (user) { const ok = await user.canEdit(); if (ok === false) canWrite = false; }
    const timer = setTimeout(() => { note = "Your logbook is taking a while to load. Entries may be out of date until the connection comes back."; render(); }, 10000);
    const done = () => { if (loaded.trips && loaded.ledger) { clearTimeout(timer); if (note.startsWith("Your logbook")) note = ""; } };
    const fail = err => { clearTimeout(timer); note = err?.code === "revoked" ? "Access to this logbook changed." : "Couldn't load the logbook. Reload the page to try again."; loaded.trips = loaded.ledger = true; render(true); };
    db.collection("trips").onSnapshot(s => { trips = s.docs.map(d => ({ id: d.id, ...d.data() })); if (!s.metadata.fromCache) loaded.trips = true; done(); render(); }, fail);
    db.collection("ledger").onSnapshot(s => { ledger = s.docs.map(d => ({ id: d.id, ...d.data() })); if (!s.metadata.fromCache) loaded.ledger = true; done(); render(); }, fail);
    const sub = (coll, set) => db.collection(coll).onSnapshot(s => { set(s.docs.map(d => ({ id: d.id, ...d.data() }))); render(); }, () => {});
    sub("taxes", x => taxes = x); sub("miles", x => miles = x); sub("service", x => service = x); sub("renewals", x => renewals = x);
    db.doc("settings/main").onSnapshot(s => { if (s.exists) settings = { ...settings, ...s.data() }; render(); }, () => {});
    window.claude.use("assets").then(a => { assets = a; }).catch(() => {});
    window.claude.use("sample").then(s => { sample = s; render(); }).catch(() => {});
    window.claude.use("mcp").then(m => { mcp = m; if (mcp) startWatches(); render(); }).catch(() => {});
  })();
})();
</script>
