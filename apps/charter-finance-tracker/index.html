  // ---------- BOAT ----------
  function viewBoat() {
    const now = engineNow();
    const rank = s => ["overdue", "soon", "unknown", "ok"].indexOf(serviceStatus(s).status);
    const svc = service.slice().sort((a, b) => rank(a) - rank(b));
    const svcRows = svc.map(s => {
      const st = serviceStatus(s);
      const bits = [];
      if (+s.everyHours) bits.push(`every ${s.everyHours} hrs`);
      if (+s.everyMonths) bits.push(`every ${s.everyMonths} mo`);
      const last = s.lastDate ? `last done ${fmtDate(s.lastDate)}${s.lastHours !== "" && s.lastHours != null ? ` at ${num(+s.lastHours, 0)} hrs` : ""}` : "not logged yet";
      const left = st.hoursLeft != null ? `${num(Math.abs(st.hoursLeft), 0)} hrs ${st.hoursLeft < 0 ? "over" : "left"}` : st.daysLeft != null ? `${Math.abs(st.daysLeft)} days ${st.daysLeft < 0 ? "over" : "left"}` : "";
      return `<div class="row nodate"><span class="main"><span class="t1">${esc(s.name)}<span class="pill ${st.status}">${st.status === "unknown" ? "no record" : st.status === "ok" ? "ok" : st.status === "soon" ? "due soon" : "overdue"}</span></span><span class="t2">${esc(bits.join(", "))} · ${esc(last)}${left ? " · " + left : ""}</span></span>
        <span class="add-row">${canWrite ? `<button class="btn small" type="button" data-service-done="${esc(s.id)}">Done</button><button class="btn small ghost" type="button" data-edit-service="${esc(s.id)}">Edit</button>` : ""}</span></div>`;
    }).join("");
    const rn = renewals.slice().sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
    const rnRows = rn.map(r => {
      const s = renewalStatus(r);
      return `<button class="row nodate" type="button" data-edit-renewal="${esc(r.id)}"><span class="main"><span class="t1">${esc(r.name)}<span class="pill ${s.status}">${s.status === "unknown" ? "add date" : s.status === "ok" ? "ok" : s.status === "soon" ? "renew soon" : "expired"}</span></span><span class="t2">${r.due ? (s.d < 0 ? `Expired ${fmtDate(r.due)}` : `Due ${fmtDate(r.due)} · ${s.d} days`) : "No date set"}${r.notes ? " · " + esc(r.notes) : ""}</span></span><span class="note">›</span></button>`;
    }).join("");
    const maint = ledger.filter(e => e.kind === "expense" && e.cat === "maintenance").sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8);
    return `
    <div class="card"><div class="card-head"><h2>Engine hours</h2>${canWrite ? `<button class="btn small" type="button" data-act="engine">Update</button>` : ""}</div>
      ${now != null ? `<div class="big num">${num(now, 0)} <span class="label">hrs</span></div><p class="note" style="margin-bottom:0">You entered ${num(+settings.engineHours, 0)} hrs on ${settings.engineHoursDate ? fmtDate(settings.engineHoursDate) : "—"}, plus hours from completed trips since then. Update it from the meter now and then to stay accurate.</p>`
        : `<p class="note" style="margin:0">Enter the hour meter reading from your engine. The app adds the hours from each trip you log so it can warn you before service is due.</p>`}</div>
    <div class="card"><div class="card-head"><h2>Service schedule</h2>${canWrite ? `<button class="btn small primary" type="button" data-act="add-service">+ Item</button>` : ""}</div>
      ${svc.length ? `<div class="list">${svcRows}</div>` : `<p class="note">No service items yet. Add oil changes, impellers, bottom cleaning and anything else on a schedule.</p>`}
      <p class="note" style="margin-bottom:0">Intervals are common defaults. Check your engine's manual and adjust them.</p></div>
    <div class="card"><div class="card-head"><h2>Licenses, documents & renewals</h2>${canWrite ? `<button class="btn small primary" type="button" data-act="add-renewal">+ Item</button>` : ""}</div>

  // ---------- CUSTOMERS ----------
  function customerList() {
    const map = new Map();
    trips.forEach(t => {
      const name = (t.customer || "").trim(); if (!name) return;
      const k = name.toLowerCase();
      const c = map.get(k) || { key: k, name, trips: [], spent: 0, owed: 0, email: "", phone: "", last: "", next: "", source: "", referredBy: "" };
      c.trips.push(t); c.spent += tripIncome(t); c.owed += t.status !== "quote" ? balanceOf(t) : 0;
      if (t.email) c.email = t.email; if (t.phone) c.phone = t.phone; if (t.source && !c.source) c.source = t.source; if (t.referredBy) c.referredBy = t.referredBy;
      if (t.status === "completed" && t.date > c.last) c.last = t.date;
      if (t.status === "booked" && t.date >= T0() && (!c.next || t.date < c.next)) c.next = t.date;
      map.set(k, c);
    });
    return [...map.values()].sort((a, b) => b.spent - a.spent);
  }

  function openTripSheet(id) {
    const t = trips.find(x => x.id === id); if (!t) return;
    const ps = payStatus(t); const w = waiverCount(t);
    const pays = Array.isArray(t.payments) ? t.payments : [];
    const legacyPaid = !Array.isArray(t.payments) && paidOf(t) > 0;

        ${field("f-tips", "Tips ($)", `<input id="f-tips" type="number" step="0.01" min="0" inputmode="decimal" value="${esc(t.tips)}" placeholder="0">`)}
        ${field("f-refund", "Refunded if cancelled ($)", `<input id="f-refund" type="number" step="0.01" min="0" inputmode="decimal" value="${esc(t.refund || "")}" placeholder="0">`)}

      let total = +v("#f-base") || 0;
      if (lst?.perPerson) total = (+lst.price || 0) * party;

      } else box.hidden = true;

    });
    form.querySelectorAll("input,select").forEach(el => el.addEventListener("input", recalc));
    recalc();
  }

  async function submitForm() {
    const kind = form.dataset.kind, id = form.dataset.id;

    try {
      if (kind === "trip") {

        const status = v("#f-status"), type = v("#f-type");
        const ld = dayLoad(date, id || null);
        const conflict = (status === "booked" || status === "quote") && (ld.status === "blocked" || ld.full > 0 || (type === "full" && ld.half > 0) || ld.half >= Math.max(1, +settings.halfSlots || 2));
        if (conflict && form.dataset.confirm !== "1" && (!prev || prev.date !== date || prev.type !== type || prev.status !== status)) { form.dataset.confirm = "1"; throw { msg: "That day is already full or blocked. Tap Save again to book it anyway." }; }
        const party = +v("#f-party") || 0;
        const lst = listings.find(l => l.id === v("#f-listing"));
        const addOns = [...form.querySelectorAll(".f-addon:checked")].map(cb => addons.find(a => a.id === cb.value)).filter(Boolean).map(a => ({ id: a.id, name: a.name, price: +a.price || 0, qty: a.perPerson ? Math.max(1, party) : 1 }));
        const base = lst?.perPerson ? (+lst.price || 0) * Math.max(1, party) : +v("#f-base") || 0;
        const discount = +v("#f-discount") || 0;
        const fee = Math.max(0, base + addOns.reduce((a, x) => a + x.price * x.qty, 0) - discount);
        const prevGuests = new Map((prev?.guests || []).map(g => [g.name.toLowerCase(), g]));
        const guests = v("#f-guests").split("\n").map(s => s.trim()).filter(Boolean).map(n => ({ name: n, waiver: !!prevGuests.get(n.toLowerCase())?.waiver }));
        let payments = prev ? (Array.isArray(prev.payments) ? prev.payments : (paidOf(prev) > 0 ? [{ date: prev.date, amount: paidOf(prev), method: prev.pay || "", note: "Earlier payment" }] : [])) : [];
        const paidNow = +v("#f-paynow") || 0;
        if (!prev && paidNow > 0) payments = [{ date: T0(), amount: paidNow, method: v("#f-paymethod"), note: paidNow < fee ? "Deposit" : "" }];
        const body = { date, time: v("#f-time"), type, listingId: lst?.id || "", status, base, addOns, discount, fee, depositReq: +v("#f-depreq") || 0, payments, tips: +v("#f-tips") || 0, refund: +v("#f-refund") || 0,
          party, hours: +v("#f-hours") || 0, customer: v("#f-customer"), email: v("#f-email"), phone: v("#f-phone"), source: v("#f-source"), referredBy: v("#f-ref"), guests,
          crew: [...form.querySelectorAll(".f-crew:checked")].map(cb => cb.value), notes: v("#f-notes"),
          catch: prev?.catch || [], photos: prev?.photos || [], msgs: prev?.msgs || {}, emailThreadId: form.dataset.thread || prev?.emailThreadId || "", calEventId: prev?.calEventId || "",
          bookedOn: prev?.bookedOn || (status === "booked" || status === "completed" ? T0() : ""), quotedOn: prev?.quotedOn || (status === "quote" ? T0() : ""),
          quoteExpires: status === "quote" ? (prev?.quoteExpires || iso(addDays(today(), +settings.quoteDays || 7))) : (prev?.quoteExpires || ""), created: prev?.created || Date.now(), example: false };
        if (prev && prev.status === "quote" && status === "booked" && !prev.bookedOn) body.bookedOn = T0();
        const newId = await put("trips", id, body);
        dlg.close(); toast(id ? "Trip updated" : status === "quote" ? "Quote saved" : status === "booked" ? "Booking added" : "Trip logged");
        if (!id && body.email && (status === "booked" || status === "quote")) setTimeout(() => { const nt = trips.find(x => x.id === newId); if (nt) openMessage(status === "quote" ? "quote" : "confirm", newId); }, 600);
      } else if (kind === "payment") {

        await db.collection("trips").doc(id).update({ catch: ct, photos });

      } else if (kind === "engine") {

      } else if (kind === "taxpay") {

      } else if (kind === "miles") {
        const mi = +v("#m-mi"); if (!(mi > 0)) throw { msg: "Enter the miles driven." };
        if (!okDate(v("#m-date"))) throw { msg: "Pick a date." };

      } else if (kind === "listing") {

  async function exportCsv() {
    const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
    const lines = [["Date", "Kind", "Category / trip", "Schedule C line", "Status", "Amount", "Paid", "Balance", "Tips", "Gallons", "Miles", "Party", "Hours", "Customer / vendor", "Source", "Receipt", "Notes"].join(",")];

      case "engine": openEngine(); break;
      case "connect-mail": connect("mail"); break;
      case "connect-cal": connect("cal"); break;
      case "refresh-mail": mcp?.invalidate("Gmail").catch(() => {}); toast("Checking for new email…"); break;
      case "close-thread": mail.open = null; render(true); break;
      case "ai-draft": aiDraft(); break;
      case "blank-draft": mail.open.draft = { to: replyTarget(), body: "", busy: false, err: "", saved: false }; render(true); break;
      case "save-draft": saveDraft(); break;
      case "trip-to-cal": tripToCalendar(); break;
      case "book-from-mail": bookFromMail(d.as || "booked"); break;
      case "decline-mail": declineFromMail(); break;
      case "catch-row": { const wrap = $("#c-rows"); const i = wrap.querySelectorAll(".c-s").length; wrap.insertAdjacentHTML("beforeend", `${field("c-s" + i, "", `<input id="c-s${i}" class="c-s" list="species-list" placeholder="Species">`)}<div class="fgrid" style="gap:8px">${field("c-k" + i, "", `<input id="c-k${i}" class="c-k" type="number" min="0" step="1" inputmode="numeric" placeholder="Kept">`)}${field("c-r" + i, "", `<input id="c-r${i}" class="c-r" type="number" min="0" step="1" inputmode="numeric" placeholder="Released">`)}</div>`); break; }
      case "tpl-reset": { const k = form.dataset.id; const nt = { ...templates }; delete nt[k]; db.doc("settings/templates").set(nt).then(() => { dlg.close(); toast("Template reset"); }, err => showErr(writeErr(err))); break; }
      case "msg-copy": copyText(`${v("#y-subj")}\n\n${$("#y-body").value}`, "Message copied"); break;
      case "msg-mark": markSent(form.dataset.id, form.dataset.msgKind).then(() => { dlg.close(); toast("Marked as sent"); }, err => showErr(writeErr(err))); break;
    }
  });
  document.addEventListener("submit", async e => {
    e.preventDefault();
    if (e.target.id === "dlgForm") return submitForm();
    if (e.target.id !== "setForm") return;
    const f = new FormData(e.target);
    const s = k => String(f.get(k) || "").trim();
    const body = { ...settings, name: s("name"), phone: s("phone"), homePort: s("homePort"), payLink: s("payLink"), waiverLink: s("waiverLink"), reviewLink: s("reviewLink"), policy: s("policy"),
      halfSlots: Math.min(4, Math.max(1, +f.get("halfSlots") || 2)), quoteDays: Math.min(60, Math.max(1, +f.get("quoteDays") || 7)),
      incomeRate: Math.min(40, Math.max(0, +f.get("incomeRate") || 0)), stateRate: Math.min(15, Math.max(0, +f.get("stateRate") || 0)), mileRate: Math.max(0, +f.get("mileRate") || 0) };
    try { await db.doc("settings/main").set(body); toast("Saved"); } catch (err) { toast(writeErr(err)); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "askQ" && !e.shiftKey) { e.preventDefault(); ask(); } });

  // ================= boot =================
  render(true);
  (async () => {
    db = await window.claude?.use?.("db") ?? null;
    if (!db) { note = "Open this page while signed in to claude.ai to save and see entries."; render(true); return; }
    const user = await window.claude.use("user");
    if (user) { const ok = await user.canEdit(); if (ok === false) canWrite = false; }
    const timer = setTimeout(() => { note = "Your logbook is taking a while to load. Entries may be out of date until the connection comes back."; render(); }, 10000);
    const done = () => { if (loaded.trips && loaded.ledger) { clearTimeout(timer); if (note.startsWith("Your logbook")) note = ""; } };
    const fail = err => { clearTimeout(timer); note = err?.code === "revoked" ? "Access to this logbook changed." : "Couldn't load the logbook. Reload the page to try again."; loaded.trips = loaded.ledger = true; render(true); };
    db.collection("trips").onSnapshot(s => { trips = s.docs.map(d => ({ id: d.id, ...d.data() })); if (!s.metadata.fromCache) loaded.trips = true; done(); render(); if (dlg.open && form.dataset.kind === "sheet") openTripSheet(form.dataset.id); }, fail);
    db.collection("ledger").onSnapshot(s => { ledger = s.docs.map(d => ({ id: d.id, ...d.data() })); if (!s.metadata.fromCache) loaded.ledger = true; done(); render(); }, fail);
    const sub = (coll, set) => db.collection(coll).onSnapshot(s => { set(s.docs.map(d => ({ id: d.id, ...d.data() }))); render(); }, () => {});
    sub("taxes", x => taxes = x); sub("miles", x => miles = x); sub("service", x => service = x); sub("renewals", x => renewals = x);
    sub("listings", x => listings = x); sub("addons", x => addons = x); sub("crew", x => crew = x); sub("gifts", x => gifts = x); sub("blocks", x => blocks = x);
    db.doc("settings/main").onSnapshot(s => { if (s.exists) settings = { ...settings, ...s.data() }; render(); }, () => {});
    db.doc("settings/templates").onSnapshot(s => { templates = s.exists ? s.data() : {}; render(); }, () => {});
    window.claude.use("assets").then(a => { assets = a; }).catch(() => {});
    window.claude.use("sample").then(s => { sample = s; render(); }).catch(() => {});
    window.claude.use("mcp").then(m => { mcp = m; if (mcp) startWatches(); render(); }).catch(() => {});
  })();
})();
</script>
