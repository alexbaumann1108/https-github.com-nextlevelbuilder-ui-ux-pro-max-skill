<title>Charter Logbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a captain's office in one page — sticky header with scrolling tabs, one column on phones, two-up cards on wide screens. Teal = money in, buoy orange = money out. */
:root {
  --bg: #eef3f4; --surface: #ffffff; --surface-2: #f6f9f9; --ink: #102530; --muted: #5a6e77; --line: #d6e0e3;
  --accent: #0d6b70; --accent-ink: #ffffff; --out: #d9622a; --good: #2b8a4b; --bad: #bf432b; --warn: #a8740b;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a171d; --surface: #0f222a; --surface-2: #132b34; --ink: #e3eef0; --muted: #8aa1a9; --line: #1f3b46;
  --accent: #3db1ad; --accent-ink: #062024; --out: #f0874f; --good: #5ac47b; --bad: #ef7a5c; --warn: #e2b04a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0a171d; --surface: #0f222a; --surface-2: #132b34; --ink: #e3eef0; --muted: #8aa1a9; --line: #1f3b46;
  --accent: #3db1ad; --accent-ink: #062024; --out: #f0874f; --good: #5ac47b; --bad: #ef7a5c; --warn: #e2b04a; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h2 { font-size: 1.35rem; } h3 { font-size: 1.1rem; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .55; cursor: default; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 8px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 1.6rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .sub { color: var(--muted); font-size: .85rem; white-space: nowrap; }
@media (max-width: 420px) { .brand .sub { display: none; } }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 7px 12px; border-radius: 999px; font-weight: 600; color: var(--muted); white-space: nowrap; position: relative; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--surface); }
.tab .badge { display: inline-block; min-width: 1.2em; padding: 0 5px; margin-left: 5px; border-radius: 999px; background: var(--out); color: #fff; font-size: .72rem; line-height: 1.4; }

.add-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; text-decoration: none; color: var(--ink); display: inline-block; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.out { background: var(--out); color: #fff; border-color: var(--out); }
.btn.ghost { background: none; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 5px 10px; font-size: .85rem; }

main { padding-block: 16px 48px; display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .grid2 { grid-template-columns: 1fr 1fr; } }

.periods { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: .88rem; font-weight: 500; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--surface-2); font-weight: 600; }

.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--surface-2); border: 1px dashed var(--warn); border-radius: var(--r); padding: 10px 14px; font-size: .92rem; }
.banner strong { color: var(--warn); }

.hero { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .hero { grid-template-columns: 1.3fr 1fr 1fr; } }
.big { font-family: var(--display); font-size: 2.6rem; line-height: 1; font-weight: 700; }
.mid { font-family: var(--display); font-size: 1.7rem; line-height: 1.05; font-weight: 700; }
.pos { color: var(--good); } .neg { color: var(--bad); } .in { color: var(--accent); } .outc { color: var(--out); }
.stat { display: grid; gap: 4px; align-content: start; }
.stat .hint { font-size: .85rem; color: var(--muted); }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0,1fr)); margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
@media (min-width: 640px) { .tiles { grid-template-columns: repeat(4, minmax(0,1fr)); } }
.tile .v { font-family: var(--display); font-size: 1.35rem; font-weight: 700; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td.wrap-cell { white-space: normal; }
thead th { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
tr.total td { font-weight: 700; border-bottom: 0; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

.bars { display: grid; gap: 9px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 9.5rem) 1fr auto; gap: 10px; align-items: center; font-size: .9rem; }
.bar-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.bar-fill { display: block; height: 100%; background: var(--out); border-radius: 5px; }
.bar-row .amt { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 4.5rem; text-align: right; }

.insights { display: grid; }
.ins { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: .93rem; }
.ins:last-child { border-bottom: 0; }
.ins .k { color: var(--muted); }
.ins .v { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

.chart svg { display: block; width: 100%; height: auto; }
.legend { display: flex; gap: 14px; font-size: .82rem; color: var(--muted); }

.list { display: grid; }
.row { display: grid; grid-template-columns: 3.2rem 1fr auto; gap: 12px; align-items: center; padding: 10px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; }
button.row:hover { background: var(--surface-2); }
.row .date { font-family: var(--display); font-weight: 700; line-height: 1.05; text-align: center; color: var(--muted); }
.row .date b { display: block; font-size: 1.3rem; color: var(--ink); }
.row .main { min-width: 0; }
.row .t1 { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.row .t2 { font-size: .84rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.row .amt { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.row.unread .t1 { color: var(--ink); } .row.unread .date b::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 3px; vertical-align: 4px; }
.pill { display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
.pill.half { color: var(--accent); } .pill.full { color: var(--ink); } .pill.other { color: var(--muted); }
.pill.booked, .pill.soon { color: var(--warn); } .pill.cancelled, .pill.overdue { color: var(--bad); } .pill.ok, .pill.paid { color: var(--good); }
.pill.ex { color: var(--warn); border-style: dashed; } .pill.gcal { color: var(--muted); } .pill.req { color: var(--out); } .pill.unknown { color: var(--muted); }

.alerts { display: grid; gap: 8px; }
.alert { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); border-left: 4px solid var(--warn); font-size: .93rem; flex-wrap: wrap; }
.alert.bad { border-left-color: var(--bad); } .alert.info { border-left-color: var(--accent); }
.alert .a-txt { min-width: 0; flex: 1 1 14rem; }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal .wd { text-align: center; font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 2px 0 4px; }
.cal .day { min-height: 3.1rem; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 3px 4px; text-align: left; display: flex; flex-direction: column; gap: 2px; font-size: .82rem; }
.cal .day.out-m { opacity: .4; }
.cal .day.today { border-color: var(--accent); }
.cal .day[aria-pressed="true"] { background: var(--surface-2); border-color: var(--ink); }
.cal .day .dn { font-weight: 600; font-variant-numeric: tabular-nums; }
.cal .marks { display: flex; gap: 2px; flex-wrap: wrap; }
.cal .mk { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.cal .mk.full { background: var(--ink); } .cal .mk.booked { background: var(--warn); } .cal .mk.gcal { background: var(--muted); } .cal .mk.cancelled { background: var(--bad); }

.ask { display: grid; gap: 10px; }
.ask textarea { width: 100%; min-height: 3.2rem; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); resize: vertical; }
.ask .suggest { display: flex; gap: 6px; flex-wrap: wrap; }
.answer { white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 12px; font-size: .95rem; max-width: 70ch; }

.msg { border-bottom: 1px solid var(--line); padding: 12px 0; display: grid; gap: 6px; }
.msg:last-child { border-bottom: 0; }
.msg .mh { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: .88rem; color: var(--muted); }
.msg .mh b { color: var(--ink); }
.msg .body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .93rem; max-height: 26rem; overflow-y: auto; }

.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.empty h3 { color: var(--ink); font-size: 1.3rem; margin-bottom: 6px; }
.note { font-size: .88rem; color: var(--muted); }
.status-line { font-size: .85rem; color: var(--muted); margin: 0; }
.links { display: flex; gap: 8px; flex-wrap: wrap; }

dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgb(5 15 20 / .55); }
.dlg-in { padding: 18px; display: grid; gap: 14px; }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.fgrid { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.fgrid .full { grid-column: 1 / -1; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: .78rem; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); min-width: 0; }
.field textarea { min-height: 60px; resize: vertical; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--surface-2); padding: 9px 6px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.dlg-foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.dlg-foot .right { display: flex; gap: 8px; margin-left: auto; }
.err { color: var(--bad); font-size: .88rem; margin: 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; z-index: 20; max-width: calc(100vw - 32px); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .2s ease-out; } @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0 } } }
</style>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand"><h1 id="bizName">Charter Logbook</h1><span class="sub" id="todayLbl"></span></div>
      <div class="add-row">
        <button class="btn primary" id="addTripBtn" type="button">+ Trip</button>
        <button class="btn out" id="addExpBtn" type="button">+ Expense</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>

<div class="wrap">
  <main id="app">
    <div class="card empty"><h3>Loading your logbook…</h3><p>Your trips, money, taxes, boat upkeep, customers and email will show up here. Tap <b>+ Trip</b> or <b>+ Expense</b> to log your first entry.</p></div>
  </main>
</div>

<dialog id="dlg"><form class="dlg-in" id="dlgForm" novalidate></form></dialog>

<script>
(() => {
  // ================= constants =================
  const EXP_CATS = [
    { id: "fuel", name: "Fuel", fixed: false },
    { id: "bait", name: "Bait & ice", fixed: false },
    { id: "gear", name: "Gear & tackle", fixed: false },
    { id: "maintenance", name: "Maintenance & repairs", fixed: false },
    { id: "crew", name: "Crew / mate pay", fixed: false },
    { id: "supplies", name: "Food, drinks & supplies", fixed: false },
    { id: "insurance", name: "Insurance", fixed: true },
    { id: "dockage", name: "Dockage & slip", fixed: true },
    { id: "loaninterest", name: "Boat loan interest", fixed: true },
    { id: "boatpay", name: "Boat loan principal", fixed: true },
    { id: "licenses", name: "Licenses & permits", fixed: true },
    { id: "marketing", name: "Marketing & booking fees", fixed: true },
    { id: "equipment", name: "Electronics & safety gear", fixed: true },
    { id: "other", name: "Other expense", fixed: false },
  ];
  const INC_CATS = [
    { id: "fishcleaning", name: "Fish cleaning" },
    { id: "merch", name: "Merchandise" },
    { id: "giftcert", name: "Gift certificate" },
    { id: "otherinc", name: "Other income" },
  ];
  // IRS Schedule C line for each expense category (a starting point for your accountant).
  const SCHED_C = {
    fuel: "Line 27a · Other expenses (fuel)", bait: "Line 22 · Supplies", gear: "Line 22 · Supplies", supplies: "Line 22 · Supplies",
    maintenance: "Line 21 · Repairs & maintenance", crew: "Line 11 · Contract labor", insurance: "Line 15 · Insurance",
    dockage: "Line 20b · Rent, other business property", loaninterest: "Line 16b · Interest", licenses: "Line 23 · Taxes & licenses",
    marketing: "Line 8 · Advertising", equipment: "Line 13 · Depreciation / Section 179", other: "Line 27a · Other expenses", boatpay: null,
  };
  const TRIP_TYPES = { half: "Half day", full: "Full day", other: "Other" };
  const PAY = ["Cash", "Card", "Venmo / Zelle", "Check", "Booking site"];
  const TABS = [["home", "Home"], ["trips", "Trips"], ["money", "Money"], ["inbox", "Inbox"], ["taxes", "Taxes"], ["boat", "Boat"], ["customers", "Customers"], ["settings", "Settings"]];
  const catName = id => (EXP_CATS.find(c => c.id === id) || INC_CATS.find(c => c.id === id) || { name: id }).name;
  const DAY = 864e5;
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const WD = ["Sundays","Mondays","Tuesdays","Wednesdays","Thursdays","Fridays","Saturdays"];

  // ================= state =================
  let db = null, mcp = null, sample = null, assets = null, canWrite = true;
  let trips = [], ledger = [], taxes = [], miles = [], service = [], renewals = [];
  let settings = { name: "", halfPrice: 600, fullPrice: 1100, incomeRate: 12, stateRate: 0, mileRate: 0.70, homePort: "", engineHours: "", engineHoursDate: "" };
  const loaded = { trips: false, ledger: false };
  let tab = "home", period = "year", ledgerFilter = "all", tripFilter = "all", taxYear = new Date().getFullYear();
  let calMonth = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
  let calSel = null, custSel = null, note = "";
  const mail = { state: "idle", threads: [], code: null, filter: "all", open: null };
  const gcal = { state: "idle", events: [], code: null };
  const askS = { q: "", a: "", busy: false, err: "" };
  let pendingRender = false;

  // ================= helpers =================
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const decode = s => { const t = document.createElement("textarea"); t.innerHTML = String(s || ""); return t.value; };
  const money = (n, d = 0) => (n < 0 ? "−$" : "$") + Math.abs(n || 0).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  const num = (n, d = 1) => (isFinite(n) ? n : 0).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
  const pd = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const daysUntil = s => Math.round((pd(s) - today()) / DAY);
  const fmtDate = s => { const d = pd(s); return `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };
  const fmtTime = t => { if (!t) return ""; const [h, m] = t.split(":").map(Number); return `${(h % 12) || 12}${m ? ":" + String(m).padStart(2, "0") : ""}${h < 12 ? "am" : "pm"}`; };
  const tripIncome = t => t.status === "completed" ? (+t.fee || 0) + (+t.tips || 0) : t.status === "cancelled" ? (+t.deposit || 0) : 0;
  function toast(msg) { const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
  function dateCell(d) { const x = pd(d); return `<span class="date">${MON[x.getMonth()]}<b>${x.getDate()}</b></span>`; }

  function periodRange(p) {
    const t = today();
    if (p === "week") return { start: addDays(t, -((t.getDay() + 6) % 7)), end: t, label: "This week" };
    if (p === "month") return { start: new Date(t.getFullYear(), t.getMonth(), 1), end: t, label: MONTHS[t.getMonth()] + " " + t.getFullYear() };
    if (p === "year") return { start: new Date(t.getFullYear(), 0, 1), end: t, label: t.getFullYear() + " so far" };
    if (p === "lastyear") return { start: new Date(t.getFullYear() - 1, 0, 1), end: new Date(t.getFullYear() - 1, 11, 31), label: String(t.getFullYear() - 1) };
    const dates = [...trips.map(x => x.date), ...ledger.map(x => x.date)].filter(Boolean).sort();
    const s = dates.length ? pd(dates[0]) : t;
    return { start: s < t ? s : t, end: t, label: "All time" };
  }
  const inRange = (d, r) => { if (!d) return false; const x = pd(d); return x >= r.start && x <= r.end; };

  // ================= computations =================
  function compute(r) {
    const days = Math.max(1, Math.round((r.end - r.start) / DAY) + 1);
    const T = trips.filter(t => inRange(t.date, r));
    const done = T.filter(t => t.status === "completed");
    const canc = T.filter(t => t.status === "cancelled");
    const L = ledger.filter(e => inRange(e.date, r));
    const exp = L.filter(e => e.kind === "expense");
    const otherInc = L.filter(e => e.kind === "income").reduce((a, e) => a + (+e.amount || 0), 0);
    const tripInc = T.reduce((a, t) => a + tripIncome(t), 0);
    const tips = done.reduce((a, t) => a + (+t.tips || 0), 0);
    const expTotal = exp.reduce((a, e) => a + (+e.amount || 0), 0);
    const income = tripInc + otherInc;
    const byCat = {};
    exp.forEach(e => byCat[e.cat] = (byCat[e.cat] || 0) + (+e.amount || 0));
    const types = {};
    for (const k of Object.keys(TRIP_TYPES)) { const ts = done.filter(t => t.type === k); types[k] = { n: ts.length, rev: ts.reduce((a, t) => a + tripIncome(t), 0) }; }
    const fuel = exp.filter(e => e.cat === "fuel");
    const fuelCost = fuel.reduce((a, e) => a + (+e.amount || 0), 0);
    const gallons = fuel.reduce((a, e) => a + (+e.gallons || 0), 0);
    const fuelPricedCost = fuel.filter(e => +e.gallons > 0).reduce((a, e) => a + (+e.amount || 0), 0);
    const variable = exp.filter(e => !(EXP_CATS.find(c => c.id === e.cat) || {}).fixed).reduce((a, e) => a + (+e.amount || 0), 0);
    const fixed = expTotal - variable;
    const hours = done.reduce((a, t) => a + (+t.hours || 0), 0);
    const party = done.filter(t => +t.party > 0);
    const wd = Array(7).fill(0); done.forEach(t => wd[pd(t.date).getDay()]++);
    const months = {};
    T.forEach(t => { const k = t.date.slice(0, 7); (months[k] ||= { inc: 0, exp: 0 }).inc += tripIncome(t); });
    L.forEach(e => { const k = e.date.slice(0, 7); (months[k] ||= { inc: 0, exp: 0 })[e.kind === "income" ? "inc" : "exp"] += +e.amount || 0; });
    return { days, weeks: days / 7, monthsN: days / 30.4375, yearsN: days / 365.25, T, done, canc, income, tripInc, otherInc, tips, expTotal,
      net: income - expTotal, byCat, types, fuelCost, gallons, fuelPricedCost, variable, fixed, hours, party, wd, months };
  }

  function taxCalc(year) {
    const t = today(), cur = t.getFullYear();
    const r = { start: new Date(year, 0, 1), end: year < cur ? new Date(year, 11, 31) : t };
    const c = compute(r);
    const nonDeduct = c.byCat.boatpay || 0;
    const deductible = c.expTotal - nonDeduct;
    const mi = miles.filter(m => inRange(m.date, r)).reduce((a, m) => a + (+m.miles || 0), 0);
    const mileDed = mi * (+settings.mileRate || 0);
    const net = c.income - deductible - mileDed;
    const se = Math.max(0, net) * 0.9235 * 0.153;
    const inc = Math.max(0, net - se / 2) * (+settings.incomeRate || 0) / 100;
    const st = Math.max(0, net) * (+settings.stateRate || 0) / 100;
    const total = se + inc + st;
    const frac = year < cur ? 1 : Math.max(c.days, 30) / 365;
    const projected = total / frac;
    const dues = [`${year}-04-15`, `${year}-06-15`, `${year}-09-15`, `${year + 1}-01-15`];
    const quarters = dues.map((due, i) => {
      const paid = taxes.filter(p => +p.year === year && +p.q === i + 1).reduce((a, p) => a + (+p.amount || 0), 0);
      const suggested = projected / 4;
      const d = daysUntil(due);
      const status = paid >= suggested * 0.98 && suggested > 0 ? "paid" : d < 0 ? (suggested > 0 ? "overdue" : "ok") : d <= 30 ? "soon" : "upcoming";
      return { q: i + 1, due, paid, suggested, status, d };
    });
    const paidTotal = quarters.reduce((a, q) => a + q.paid, 0);
    return { year, r, c, deductible, nonDeduct, mi, mileDed, net, se, inc, st, total, projected, quarters, paidTotal };
  }

  function engineNow() {
    if (settings.engineHours === "" || settings.engineHours == null) return null;
    const since = settings.engineHoursDate || "0000-00-00";
    const add = trips.filter(t => t.status === "completed" && t.date > since && t.date <= iso(today())).reduce((a, t) => a + (+t.hours || 0), 0);
    return +settings.engineHours + add;
  }
  function serviceStatus(s) {
    const now = engineNow();
    let hoursLeft = null, daysLeft = null;
    if (+s.everyHours > 0 && s.lastHours !== "" && s.lastHours != null && now != null) hoursLeft = +s.lastHours + +s.everyHours - now;
    if (+s.everyMonths > 0 && s.lastDate) { const d = pd(s.lastDate); d.setMonth(d.getMonth() + +s.everyMonths); daysLeft = Math.round((d - today()) / DAY); }
    let status = "unknown";
    if (hoursLeft != null || daysLeft != null) {
      status = (hoursLeft != null && hoursLeft < 0) || (daysLeft != null && daysLeft < 0) ? "overdue"
        : (hoursLeft != null && hoursLeft <= 15) || (daysLeft != null && daysLeft <= 21) ? "soon" : "ok";
    }
    return { hoursLeft, daysLeft, status };
  }
  function renewalStatus(r) {
    if (!r.due) return { status: "unknown", d: null };
    const d = daysUntil(r.due);
    return { status: d < 0 ? "overdue" : d <= 45 ? "soon" : "ok", d };
  }

  // ================= booking email parsing =================
  function parseBooking(subject, body, senderEmail, ownEmails) {
    const text = `${subject}\n${body}`;
    const out = { type: "half", date: "", time: "", fee: "", customer: "", email: "", phone: "", party: "" };
    const dm = text.match(/(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2}),?\s+(\d{4})/i);
    if (dm) out.date = iso(new Date(+dm[3], MONTHS.findIndex(m => m.toLowerCase() === dm[1].toLowerCase()), +dm[2]));
    if (/full[\s-]?day/i.test(text)) out.type = "full"; else if (/half[\s-]?day/i.test(text)) out.type = "half";
    const tm = text.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);
    if (tm) { let h = +tm[1] % 12; if (/pm/i.test(tm[3])) h += 12; out.time = `${String(h).padStart(2, "0")}:${tm[2] || "00"}`; }
    else if (/afternoon/i.test(text)) out.time = "13:00"; else if (/morning/i.test(text)) out.time = "07:00";
    const fm = text.match(/\$\s?([\d,]+(?:\.\d{2})?)/); if (fm) out.fee = +fm[1].replace(/,/g, "");
    const cm = subject.match(/\bfrom\s+(.+?)\s*$/i); if (cm) out.customer = cm[1];
    const skip = new Set([String(senderEmail || "").toLowerCase(), ...(ownEmails || []).map(e => String(e).toLowerCase())]);
    const em = (body.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi) || []).find(e => !skip.has(e.toLowerCase()) && !/resend\.dev|noreply|no-reply/i.test(e));
    if (em) out.email = em;
    const ph = body.match(/(\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}/); if (ph) out.phone = ph[0].trim();
    const pm = text.match(/(\d{1,2})\s+(?:people|anglers|guests|persons|adults)/i) || text.match(/party(?: size)?[:\s]+(\d{1,2})/i); if (pm) out.party = +pm[1];
    return out;
  }

  // ---------- MONEY ----------
  function viewMoney() {
    const r = periodRange(period), c = compute(r);
    const nTrips = c.done.length;
    const margin = c.income > 0 ? c.net / c.income * 100 : 0;
    const rows = Object.entries(TRIP_TYPES).filter(([k]) => k !== "other" || c.types.other.n > 0).map(([k, name]) => {
      const t = c.types[k];
      return `<tr><td>${name}</td><td>${t.n}</td><td>${num(t.n / c.weeks)}</td><td>${num(t.n / c.monthsN)}</td><td>${num(t.n / c.yearsN, 0)}</td><td>${money(t.rev)}</td><td>${t.n ? money(t.rev / t.n) : "—"}</td></tr>`;
    }).join("");
    const allRev = Object.values(c.types).reduce((a, t) => a + t.rev, 0);
    const table = `<div class="tbl-wrap"><table><thead><tr><th>Trip type</th><th>Trips</th><th>/ week</th><th>/ month</th><th>/ year</th><th>Revenue</th><th>Avg</th></tr></thead><tbody>${rows}
      <tr class="total"><td>All trips</td><td>${nTrips}</td><td>${num(nTrips / c.weeks)}</td><td>${num(nTrips / c.monthsN)}</td><td>${num(nTrips / c.yearsN, 0)}</td><td>${money(allRev)}</td><td>${nTrips ? money(allRev / nTrips) : "—"}</td></tr></tbody></table></div>`;
    const cats = Object.entries(c.byCat).sort((a, b) => b[1] - a[1]);
    const maxCat = cats.length ? cats[0][1] : 1;
    const bars = cats.length ? `<div class="bars">${cats.map(([k, v]) => `<div class="bar-row"><span class="nm">${esc(catName(k))}</span><span class="bar-track"><span class="bar-fill" style="width:${Math.max(2, v / maxCat * 100)}%"></span></span><span class="amt">${money(v)}</span></div>`).join("")}</div>` : `<p class="note">No expenses logged in this period.</p>`;
    const busiest = c.wd.some(x => x) ? WD[c.wd.indexOf(Math.max(...c.wd))] : "—";
    const fixedPerMonth = c.fixed / Math.max(1, c.monthsN);
    const avgRev = nTrips ? c.tripInc / nTrips : 0;
    const contrib = avgRev - (nTrips ? c.variable / nTrips : 0);
    const breakEven = contrib > 0 && c.fixed > 0 ? Math.ceil(fixedPerMonth / contrib) : null;
    const cancRate = (c.done.length + c.canc.length) ? c.canc.length / (c.done.length + c.canc.length) * 100 : 0;
    const ppg = c.gallons > 0 ? c.fuelPricedCost / c.gallons : 0;
    const ms = Object.entries(c.months).sort((a, b) => (b[1].inc - b[1].exp) - (a[1].inc - a[1].exp));
    const best = ms.length ? `${MON[+ms[0][0].slice(5) - 1]} ${ms[0][0].slice(0, 4)} (${money(ms[0][1].inc - ms[0][1].exp)})` : "—";
    const ins = [
      ["Fuel per trip", nTrips ? money(c.fuelCost / nTrips) : "—"],
      ["Gallons burned · avg price", c.gallons ? `${num(c.gallons, 0)} gal · ${money(ppg, 2)}/gal` : "—"],
      ["All costs per trip", nTrips ? money(c.expTotal / nTrips) : "—"],
      ["Profit per trip", nTrips ? money(c.net / nTrips) : "—"],
      ["Fixed costs per month", money(fixedPerMonth)],
      ["Trips a month to cover fixed costs", breakEven ? `${breakEven} trips` : "—"],
      ["Revenue per hour on the water", c.hours ? money(c.tripInc / c.hours) : "—"],
      ["Average party size", c.party.length ? num(c.party.reduce((a, t) => a + +t.party, 0) / c.party.length) + " anglers" : "—"],
      ["Busiest day", busiest],
      ["Cancellations", `${c.canc.length} (${num(cancRate, 0)}%)`],
      ["Best month", best],
    ].map(([k, v]) => `<div class="ins"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("");

    // ledger
    let lr = [...trips.filter(t => inRange(t.date, r) && t.status !== "booked").map(t => ({ ...t, _t: "trip" })), ...ledger.filter(e => inRange(e.date, r)).map(e => ({ ...e, _t: "ledger" }))];
    if (ledgerFilter === "expense") lr = lr.filter(x => x._t === "ledger" && x.kind === "expense");
    else if (ledgerFilter === "income") lr = lr.filter(x => x._t === "trip" || x.kind === "income");
    else if (ledgerFilter === "noreceipt") lr = lr.filter(x => x._t === "ledger" && x.kind === "expense" && !x.receiptId);
    else if (ledgerFilter !== "all") lr = lr.filter(x => x._t === "ledger" && x.cat === ledgerFilter);
    lr.sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));
    const sumIn = lr.reduce((a, x) => a + (x._t === "trip" ? tripIncome(x) : x.kind === "income" ? +x.amount || 0 : 0), 0);
    const sumOut = lr.reduce((a, x) => a + (x._t === "ledger" && x.kind === "expense" ? +x.amount || 0 : 0), 0);
    const lf = [["all", "Everything"], ["income", "Money in"], ["expense", "Money out"], ["fuel", "Fuel"], ["bait", "Bait"], ["gear", "Gear"], ["maintenance", "Maintenance"], ["insurance", "Insurance"], ["noreceipt", "Missing receipt"]];

    return `
    <div class="card">
      <div class="card-head"><h2>${esc(r.label)}</h2>${periodChips()}</div>
      <div class="hero">
        <div class="stat"><span class="label">Net profit</span><span class="big num ${c.net >= 0 ? "pos" : "neg"}">${money(c.net)}</span><span class="hint">${c.income > 0 ? num(margin, 0) + "% margin" : "No income yet"}</span></div>
        <div class="stat"><span class="label">Money in</span><span class="mid num in">${money(c.income)}</span><span class="hint">${money(c.tripInc)} trips · ${money(c.tips)} tips${c.otherInc ? " · " + money(c.otherInc) + " other" : ""}</span></div>
        <div class="stat"><span class="label">Money out</span><span class="mid num outc">${money(c.expTotal)}</span><span class="hint">${money(c.fixed)} fixed · ${money(c.variable)} per-trip</span></div>
      </div>
      <div class="tiles">
        <div class="tile"><div class="label">Trips run</div><div class="v num">${nTrips}</div></div>
        <div class="tile"><div class="label">Half / full</div><div class="v num">${c.types.half.n} / ${c.types.full.n}</div></div>
        <div class="tile"><div class="label">Avg per trip</div><div class="v num">${nTrips ? money(avgRev) : "—"}</div></div>
        <div class="tile"><div class="label">Trips / week</div><div class="v num">${num(nTrips / c.weeks)}</div></div>
      </div>
    </div>
    <div class="card"><div class="card-head"><h2>Trip averages</h2><span class="note">${esc(r.label)} · ${c.days} days</span></div>${table}
      <p class="note" style="margin:10px 0 0">Per week, month and year are your pace over the selected period. Only completed trips count.</p></div>
    <div class="card chart"><div class="card-head"><h2>Last 12 months</h2><div class="legend"><span><span class="dot" style="background:var(--accent)"></span>Money in</span><span><span class="dot" style="background:var(--out)"></span>Money out</span></div></div><div id="chart"></div></div>
    <div class="grid2">
      <div class="card"><div class="card-head"><h2>Where the money goes</h2><span class="note">${money(c.expTotal)}</span></div>${bars}</div>
      <div class="card"><div class="card-head"><h2>By the numbers</h2></div><div class="insights">${ins}</div></div>
    </div>
    <div class="card"><div class="card-head"><h2>Ledger</h2><div class="add-row">${canWrite ? `<button class="btn small" type="button" data-act="add-income">+ Other income</button>` : ""}</div></div>
      <div class="periods" style="margin-bottom:8px">${lf.map(([k, l]) => `<button class="chip" type="button" data-ledgerfilter="${k}" aria-pressed="${ledgerFilter === k}">${l}</button>`).join("")}</div>
      <p class="note num" style="margin:4px 0 8px">In <b class="in">${money(sumIn, 2)}</b> · Out <b class="outc">${money(sumOut, 2)}</b> · ${lr.length} entries</p>
      ${lr.length ? `<div class="list">${lr.map(x => x._t === "trip" ? tripRow(x) : ledgerRow(x)).join("")}</div>` : `<div class="empty"><h3>Nothing logged here</h3><p>Tap <b>+ Expense</b> for fuel, bait, insurance, repairs and anything else you spend.</p></div>`}</div>`;
  }
  function ledgerRow(e) {
    const sub = [e.vendor, e.gallons ? num(+e.gallons, 1) + " gal" : "", e.notes].filter(Boolean).map(esc).join(" · ");
    const isInc = e.kind === "income";
    return `<button class="row" type="button" data-edit-ledger="${esc(e.id)}">${dateCell(e.date)}<span class="main"><span class="t1">${esc(catName(e.cat))}${e.receiptId ? `<span class="pill ok">receipt</span>` : ""}${e.example ? `<span class="pill ex">example</span>` : ""}</span><span class="t2">${sub || "&nbsp;"}</span></span><span class="amt ${isInc ? "in" : "outc"}">${isInc ? "+" : "−"}${money(+e.amount || 0, 2)}</span></button>`;
  }
  function drawChart() {
    const el = $("#chart"); if (!el) return;
    const t = today(); const ms = [];
    for (let i = 11; i >= 0; i--) { const d = new Date(t.getFullYear(), t.getMonth() - i, 1); ms.push({ k: iso(d).slice(0, 7), m: d.getMonth(), inc: 0, exp: 0 }); }
    const idx = Object.fromEntries(ms.map((m, i) => [m.k, i]));
    trips.forEach(x => { const i = idx[x.date?.slice(0, 7)]; if (i != null) ms[i].inc += tripIncome(x); });
    ledger.forEach(x => { const i = idx[x.date?.slice(0, 7)]; if (i != null) ms[i][x.kind === "income" ? "inc" : "exp"] += +x.amount || 0; });
    const max = Math.max(1, ...ms.map(m => Math.max(m.inc, m.exp)));
    const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
    const W = 720, H = 240, L = 52, R = 8, Tp = 10, B = 26, cw = (W - L - R) / 12, bw = Math.min(16, cw * .32);
    const y = v => Tp + (H - Tp - B) * (1 - v / top);
    let g = "";
    for (let v = 0; v <= top + 1e-9; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${short(v)}</text>`;
    ms.forEach((m, i) => {
      const cx = L + cw * i + cw / 2;
      g += `<rect x="${cx - bw - 1}" y="${y(m.inc)}" width="${bw}" height="${Math.max(0, y(0) - y(m.inc))}" rx="2" fill="var(--accent)"><title>${MON[m.m]}: ${money(m.inc)} in</title></rect>`;
      g += `<rect x="${cx + 1}" y="${y(m.exp)}" width="${bw}" height="${Math.max(0, y(0) - y(m.exp))}" rx="2" fill="var(--out)"><title>${MON[m.m]}: ${money(m.exp)} out</title></rect>`;
      g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${MON[m.m]}</text>`;
    });
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Money in and out by month for the last 12 months">${g}</svg>`;
  }
  function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1)))); const f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
  function short(v) { return v >= 1000 ? "$" + (v / 1000).toFixed(v % 1000 ? 1 : 0) + "k" : "$" + v; }

  // ---------- INBOX ----------
  const needsConsent = c => c === "approval_required" || c === "not_in_manifest" || c === "consent_required";
  function connMsg(server, code) {
    switch (code) {
      case "needs_reauth": return `${server} needs reconnecting. Reconnect it in claude.ai Settings → Connectors.`;
      case "server_not_connected": return `${server} isn't connected. Add it in claude.ai Settings → Connectors.`;
      case "selection_required": return `You have more than one ${server} account connected. Choose one when claude.ai asks.`;
      case "approval_required": case "not_in_manifest": case "consent_required": return `This app needs your OK to use ${server}.`;
      case "blocked_by_policy": return `${server} is blocked here by your organization's settings.`;
      case "server_unavailable": case "rate_limited": return `${server} isn't answering right now. It will try again in a few minutes.`;
      case "not_granted": case "capability_disabled": case "capability_removed": return `${server} isn't available in this view. Open the app on claude.ai.`;
      default: return `Couldn't load ${server} right now.`;
    }
  }
  function viewInbox() {
    if (!mcp) return `<div class="card empty"><h3>Email isn't available here</h3><p>Open this page on claude.ai, signed in, to see your Gmail.</p></div>`;
    if (mail.compose) return viewCompose();
    if (mail.open) return viewThread();
    const errBox = mail.state === "error" ? `<div class="alert ${needsConsent(mail.code) ? "info" : "bad"}"><span class="a-txt">${esc(connMsg("Gmail", mail.code))}</span>${needsConsent(mail.code) || mail.code === "selection_required" ? `<button class="btn small primary" type="button" data-act="connect-mail">Connect Gmail</button>` : ""}</div>` : "";
    let list = mail.threads;
    if (mail.filter === "booking") list = list.filter(t => t.booking);
    if (mail.filter === "unread") list = list.filter(t => t.unread);
    const f = [["all", "Inbox"], ["booking", "Booking requests"], ["unread", "Unread"]];
    const added = new Map(trips.filter(t => t.emailThreadId).map(t => [t.emailThreadId, t]));
    const rows = list.map(t => `<button class="row ${t.unread ? "unread" : ""}" type="button" data-open-thread="${esc(t.id)}">${t.date ? dateCell(t.date) : "<span></span>"}<span class="main"><span class="t1">${esc(t.subject)}${t.booking ? (added.has(t.id) ? `<span class="pill ok">on schedule</span>` : `<span class="pill req">booking</span>`) : ""}</span><span class="t2">${esc(t.from)} · ${esc(t.snippet)}</span></span><span class="note">${t.count > 1 ? t.count : ""}</span></button>`).join("");
    return `<div class="card"><div class="card-head"><h2>Inbox</h2><div class="add-row"><button class="btn small primary" type="button" data-act="compose">New email</button><button class="btn small" type="button" data-act="refresh-mail">Refresh</button><a class="btn small" href="https://mail.google.com/" target="_blank" rel="noopener">Open Gmail</a></div></div>
      <div class="periods" style="margin-bottom:8px">${f.map(([k, l]) => `<button class="chip" type="button" data-mailfilter="${k}" aria-pressed="${mail.filter === k}">${l}</button>`).join("")}</div>
      ${errBox}
      ${mail.state === "loading" && !mail.threads.length ? `<p class="note">Loading your email…</p>` : list.length ? `<div class="list">${rows}</div>` : mail.state === "ok" ? `<div class="empty"><h3>${mail.filter === "booking" ? "No booking requests" : "All caught up"}</h3><p>Showing the last 60 days of your inbox.</p></div>` : ""}
      <p class="note" style="margin-bottom:0">Booking requests from your website get a “booking” tag. Open one to add it to your schedule or reply. You can send right from here, or save a draft to finish in Gmail.</p></div>`;
  }
  function viewCompose() {
    const c = mail.compose;
    return `<div class="card ask"><div class="card-head" style="margin:0"><button class="btn small" type="button" data-act="close-compose">‹ Inbox</button><h2>New email</h2></div>
      <div class="fgrid">
        <div class="field full"><label for="n-to">To</label><input id="n-to" type="email" value="${esc(c.to)}" placeholder="name@example.com" list="n-contacts"><datalist id="n-contacts">${customerList().filter(x => x.email).map(x => `<option value="${esc(x.email)}">${esc(x.name)}</option>`).join("")}</datalist></div>
        <div class="field full"><label for="n-subj">Subject</label><input id="n-subj" value="${esc(c.subject)}"></div>
        <div class="field full"><label for="n-body">Message</label><textarea id="n-body" style="min-height:14rem">${esc(c.body)}</textarea></div>
      </div>
      ${c.err ? `<p class="err">${esc(c.err)}</p>` : ""}${c.saved ? `<p class="note">Saved to your Gmail drafts. <a href="https://mail.google.com/mail/#drafts" target="_blank" rel="noopener">Open drafts</a></p>` : ""}${c.sent ? `<p class="note pos"><b>Sent</b> to ${esc(c.sentTo)}.</p>` : ""}
      <div class="add-row"><button class="btn ${c.armSend ? "out" : "primary"}" type="button" data-act="send-compose" ${c.busy ? "disabled" : ""}>${c.busy === "send" ? "Sending…" : c.armSend ? "Tap again to send" : "Send"}</button><button class="btn" type="button" data-act="draft-compose" ${c.busy ? "disabled" : ""}>${c.busy === "draft" ? "Saving…" : "Save as draft"}</button></div>
      <p class="note" style="margin:0">Sends from your connected Gmail account, with your Gmail signature added.</p></div>`;
  }
  function viewThread() {
    const o = mail.open;
    const th = mail.threads.find(t => t.id === o.id) || {};
    const head = `<div class="card-head"><button class="btn small" type="button" data-act="close-thread">‹ Inbox</button>${th.url ? `<a class="btn small" href="${esc(th.url)}" target="_blank" rel="noopener">Open in Gmail</a>` : ""}</div>`;
    if (o.state === "loading") return `<div class="card">${head}<p class="note">Opening email…</p></div>`;
    if (o.state === "error") return `<div class="card">${head}<p class="err">${esc(o.err)}</p></div>`;
    const msgs = o.msgs;
    const last = msgs[msgs.length - 1] || {};
    const isBooking = /booking request/i.test(last.subject || msgs[0]?.subject || "");
    const tripFor = trips.find(t => t.emailThreadId === o.id);
    const bookingBox = isBooking ? `<div class="alert info"><span class="a-txt">${tripFor ? `On your schedule for ${fmtDate(tripFor.date)}.` : "This is a booking request."}</span>${tripFor ? `<button class="btn small" type="button" data-edit-trip="${esc(tripFor.id)}">View trip</button>` : canWrite ? `<button class="btn small primary" type="button" data-act="book-from-mail">Add to schedule</button>` : ""}</div>` : "";
    const msgHtml = msgs.map(m => `<div class="msg"><div class="mh"><span><b>${esc(m.fromName || m.sender)}</b>${m.fromName ? " · " + esc(m.sender) : ""}</span><span>${m.date ? new Date(m.date).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : ""}</span></div><div class="body">${esc(m.body || m.snippet || "")}</div></div>`).join("");
    const draft = o.draft;
    const draftBox = `<div class="card ask"><div class="card-head" style="margin:0"><h2>Reply</h2></div>
      ${draft ? `<div class="fgrid"><div class="field full"><label for="d-to">To</label><input id="d-to" value="${esc(draft.to)}"></div>
        <div class="field full"><label for="d-body">Message</label><textarea id="d-body" style="min-height:12rem">${esc(draft.body)}</textarea></div></div>
        ${draft.err ? `<p class="err">${esc(draft.err)}</p>` : ""}${draft.saved ? `<p class="note">Saved to your Gmail drafts. <a href="https://mail.google.com/mail/#drafts" target="_blank" rel="noopener">Open drafts</a> to check it and send.</p>` : ""}${draft.sent ? `<p class="note pos"><b>Sent</b> to ${esc(draft.sentTo)}.</p>` : ""}
        <div class="add-row"><button class="btn ${draft.armSend ? "out" : "primary"}" type="button" data-act="send-reply" ${draft.busy ? "disabled" : ""}>${draft.busy === "send" ? "Sending…" : draft.armSend ? "Tap again to send" : "Send"}</button><button class="btn" type="button" data-act="save-draft" ${draft.busy ? "disabled" : ""}>${draft.busy === "draft" ? "Saving…" : "Save as draft"}</button>${sample ? `<button class="btn" type="button" data-act="ai-draft" ${o.aiBusy ? "disabled" : ""}>${o.aiBusy ? "Writing…" : "Rewrite with Claude"}</button>` : ""}</div>`
      : `<div class="add-row">${sample ? `<button class="btn primary" type="button" data-act="ai-draft" ${o.aiBusy ? "disabled" : ""}>${o.aiBusy ? "Writing…" : "Draft a reply with Claude"}</button>` : ""}<button class="btn" type="button" data-act="blank-draft">Write my own</button></div>`}
      ${o.aiErr ? `<p class="err">${esc(o.aiErr)}</p>` : ""}
      <p class="note" style="margin:0">Tap Send twice to send from your Gmail account. Use Save as draft if you want to look it over in Gmail first.</p></div>`;
    return `<div class="card">${head}<h2 style="margin-bottom:8px">${esc(last.subject || th.subject || "(no subject)")}</h2>${bookingBox}${msgHtml}</div>${draftBox}`;
  }

  // ---------- TAXES ----------
  function viewTaxes() {
    const tc = taxCalc(taxYear), cur = today().getFullYear();
    const years = [cur, cur - 1];
    const qRows = tc.quarters.map(q => `<tr><td>Q${q.q}</td><td>${fmtDate(q.due)}</td><td>${money(q.suggested)}</td><td>${money(q.paid)}</td><td><span class="pill ${q.status === "upcoming" ? "unknown" : q.status}" style="margin:0">${q.status}</span></td><td>${canWrite ? `<button class="btn small" type="button" data-pay-q="${q.q}">Record</button>` : ""}</td></tr>`).join("");
    const groups = {};
    Object.entries(tc.c.byCat).forEach(([k, v]) => { const line = SCHED_C[k] === undefined ? "Line 27a · Other expenses" : SCHED_C[k]; if (line) groups[line] = (groups[line] || 0) + v; });
    if (tc.mileDed) groups["Line 9 · Car & truck (mileage)"] = tc.mileDed;
    const sc = Object.entries(groups).sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }));
    const mlist = miles.filter(m => inRange(m.date, tc.r)).sort((a, b) => b.date.localeCompare(a.date));
    const missing = ledger.filter(e => e.kind === "expense" && inRange(e.date, tc.r) && !e.receiptId).length;
    return `
    <div class="card"><div class="card-head"><h2>Taxes ${taxYear}</h2><div class="periods">${years.map(y => `<button class="chip" type="button" data-taxyear="${y}" aria-pressed="${taxYear === y}">${y}</button>`).join("")}</div></div>
      <div class="hero">
        <div class="stat"><span class="label">Estimated tax ${taxYear === cur ? "so far" : ""}</span><span class="big num">${money(tc.total)}</span><span class="hint">${taxYear === cur ? `About ${money(tc.projected)} for the full year at your current pace` : "For the full year"}</span></div>
        <div class="stat"><span class="label">Paid so far</span><span class="mid num pos">${money(tc.paidTotal)}</span><span class="hint">Estimated payments you've recorded</span></div>
        <div class="stat"><span class="label">Still to set aside</span><span class="mid num outc">${money(Math.max(0, tc.total - tc.paidTotal))}</span><span class="hint">Keep this in a separate account</span></div>
      </div>
      <div class="insights" style="margin-top:14px">
        <div class="ins"><span class="k">Business income</span><span class="v">${money(tc.c.income)}</span></div>
        <div class="ins"><span class="k">Deductible expenses</span><span class="v">−${money(tc.deductible)}</span></div>
        ${tc.mileDed ? `<div class="ins"><span class="k">Mileage deduction (${num(tc.mi, 0)} mi × ${money(+settings.mileRate, 2)})</span><span class="v">−${money(tc.mileDed)}</span></div>` : ""}
        <div class="ins"><span class="k">Net profit (Schedule C)</span><span class="v">${money(tc.net)}</span></div>
        <div class="ins"><span class="k">Self-employment tax (15.3% of 92.35%)</span><span class="v">${money(tc.se)}</span></div>
        <div class="ins"><span class="k">Federal income tax (at ${num(+settings.incomeRate, 0)}%)</span><span class="v">${money(tc.inc)}</span></div>
        ${+settings.stateRate ? `<div class="ins"><span class="k">State income tax (at ${num(+settings.stateRate, 1)}%)</span><span class="v">${money(tc.st)}</span></div>` : ""}
        ${tc.nonDeduct ? `<div class="ins"><span class="k">Boat loan principal (not deductible)</span><span class="v">${money(tc.nonDeduct)}</span></div>` : ""}
      </div>
      <p class="note">A rough estimate to plan with, not tax advice. Change your tax rates in Settings, and have your accountant confirm the numbers before you file.</p></div>
    <div class="card"><div class="card-head"><h2>Quarterly estimated payments</h2><span class="note">IRS Form 1040-ES</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>Quarter</th><th>Due</th><th>Suggested</th><th>Paid</th><th>Status</th><th></th></tr></thead><tbody>${qRows}</tbody></table></div>
      <p class="note" style="margin-bottom:0">Suggested amounts split your projected yearly tax into four. If a due date falls on a weekend or holiday, it moves to the next business day. Pay at <a href="https://www.irs.gov/payments/direct-pay" target="_blank" rel="noopener">IRS Direct Pay</a>.</p></div>
    <div class="grid2">
      <div class="card"><div class="card-head"><h2>Schedule C summary</h2></div>
        ${sc.length ? `<div class="tbl-wrap"><table><thead><tr><th>Line</th><th>Amount</th></tr></thead><tbody>${sc.map(([l, v]) => `<tr><td class="wrap-cell">${esc(l)}</td><td>${money(v)}</td></tr>`).join("")}<tr class="total"><td>Total deductions</td><td>${money(tc.deductible + tc.mileDed)}</td></tr></tbody></table></div>` : `<p class="note">No expenses logged for ${taxYear} yet.</p>`}
        <p class="note" style="margin-bottom:0">${missing ? `<b>${missing}</b> expense${missing === 1 ? " is" : "s are"} missing a receipt photo. ` : ""}Big purchases like the boat, motor or electronics are usually depreciated over several years. Ask your accountant.</p></div>
      <div class="card"><div class="card-head"><h2>Business mileage</h2>${canWrite ? `<button class="btn small primary" type="button" data-act="add-miles">+ Miles</button>` : ""}</div>
        <p class="note" style="margin-top:0">${num(tc.mi, 0)} miles in ${taxYear} · ${money(tc.mileDed)} deduction at ${money(+settings.mileRate, 2)}/mile. Log drives for bait, parts, the bank and trips to the boat (not your regular commute).</p>
        ${mlist.length ? `<div class="list">${mlist.slice(0, 12).map(m => `<button class="row" type="button" data-edit-miles="${esc(m.id)}">${dateCell(m.date)}<span class="main"><span class="t1">${esc(m.purpose || "Business drive")}</span></span><span class="amt">${num(+m.miles, 1)} mi</span></button>`).join("")}</div>` : ""}</div>
    </div>
    <div class="card"><div class="card-head"><h2>For your accountant</h2></div>
      <p class="note" style="margin-top:0">Download every trip, expense, mileage entry and tax payment as a spreadsheet, with Schedule C lines already filled in.</p>
      <div class="add-row"><button class="btn" type="button" data-act="export">Download CSV</button></div>
      <p class="note" style="margin-bottom:0">If you take cards through Square, Stripe or a booking site, you may get a Form 1099-K. Make sure its total matches your trip income here.</p></div>`;
  }

  // ---------- BOAT ----------
  function viewBoat() {
    const now = engineNow();
    const svc = service.slice().sort((a, b) => ["overdue", "soon", "unknown", "ok"].indexOf(serviceStatus(a).status) - ["overdue", "soon", "unknown", "ok"].indexOf(serviceStatus(b).status));
    const svcRows = svc.map(s => {
      const st = serviceStatus(s);
      const bits = [];
      if (+s.everyHours) bits.push(`every ${s.everyHours} hrs`);
      if (+s.everyMonths) bits.push(`every ${s.everyMonths} mo`);
      const last = s.lastDate ? `last done ${fmtDate(s.lastDate)}${s.lastHours !== "" && s.lastHours != null ? ` at ${num(+s.lastHours, 0)} hrs` : ""}` : "not logged yet";
      const left = st.hoursLeft != null ? `${num(Math.abs(st.hoursLeft), 0)} hrs ${st.hoursLeft < 0 ? "over" : "left"}` : st.daysLeft != null ? `${Math.abs(st.daysLeft)} days ${st.daysLeft < 0 ? "over" : "left"}` : "";
      return `<div class="row" style="grid-template-columns:1fr auto"><span class="main"><span class="t1">${esc(s.name)}<span class="pill ${st.status}">${st.status === "unknown" ? "no record" : st.status === "ok" ? "ok" : st.status === "soon" ? "due soon" : "overdue"}</span></span><span class="t2">${esc(bits.join(", "))} · ${esc(last)}${left ? " · " + left : ""}</span></span>
        <span class="add-row">${canWrite ? `<button class="btn small" type="button" data-service-done="${esc(s.id)}">Done</button><button class="btn small ghost" type="button" data-edit-service="${esc(s.id)}">Edit</button>` : ""}</span></div>`;
    }).join("");
    const rn = renewals.slice().sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
    const rnRows = rn.map(r => {
      const s = renewalStatus(r);
      return `<button class="row" type="button" data-edit-renewal="${esc(r.id)}" style="grid-template-columns:1fr auto"><span class="main"><span class="t1">${esc(r.name)}<span class="pill ${s.status}">${s.status === "unknown" ? "add date" : s.status === "ok" ? "ok" : s.status === "soon" ? "renew soon" : "expired"}</span></span><span class="t2">${r.due ? (s.d < 0 ? `Expired ${fmtDate(r.due)}` : `Due ${fmtDate(r.due)} · ${s.d} days`) : "No date set"}${r.notes ? " · " + esc(r.notes) : ""}</span></span><span class="note">›</span></button>`;
    }).join("");
    const maint = ledger.filter(e => e.kind === "expense" && e.cat === "maintenance").sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8);
    return `
    <div class="card"><div class="card-head"><h2>Engine hours</h2>${canWrite ? `<button class="btn small" type="button" data-act="engine">Update</button>` : ""}</div>
      ${now != null ? `<div class="big num">${num(now, 0)} <span class="label">hrs</span></div><p class="note" style="margin-bottom:0">You entered ${num(+settings.engineHours, 0)} hrs on ${settings.engineHoursDate ? fmtDate(settings.engineHoursDate) : "—"}, plus hours from completed trips since then. Update it from the meter now and then to stay accurate.</p>`
        : `<p class="note" style="margin:0">Enter the hour meter reading from your engine. The app adds the hours from each trip you log so it can warn you before service is due.</p>`}</div>
    <div class="card"><div class="card-head"><h2>Service schedule</h2>${canWrite ? `<button class="btn small primary" type="button" data-act="add-service">+ Item</button>` : ""}</div>
      ${svc.length ? `<div class="list">${svcRows}</div>` : `<p class="note">No service items yet. Add oil changes, impellers, bottom cleaning and anything else on a schedule.</p>`}
      <p class="note" style="margin-bottom:0">Intervals are common defaults. Check your engine's manual and adjust them.</p></div>
    <div class="card"><div class="card-head"><h2>Licenses, documents & renewals</h2>${canWrite ? `<button class="btn small primary" type="button" data-act="add-renewal">+ Item</button>` : ""}</div>
      ${rn.length ? `<div class="list">${rnRows}</div>` : `<p class="note">Add your captain's license, insurance, registration and safety gear dates.</p>`}</div>
    <div class="card"><div class="card-head"><h2>Recent repairs</h2><button class="btn small" type="button" data-act="add-maint">+ Repair cost</button></div>
      ${maint.length ? `<div class="list">${maint.map(ledgerRow).join("")}</div>` : `<p class="note">Repairs you log as Maintenance expenses show up here.</p>`}</div>`;
  }

  // ---------- CUSTOMERS ----------
  function customerList() {
    const map = new Map();
    trips.forEach(t => {
      const name = (t.customer || "").trim(); if (!name) return;
      const k = name.toLowerCase();
      const c = map.get(k) || { key: k, name, trips: [], spent: 0, email: "", phone: "", last: "", next: "" };
      c.trips.push(t); c.spent += tripIncome(t);
      if (t.email) c.email = t.email; if (t.phone) c.phone = t.phone;
      if (t.status === "completed" && t.date > c.last) c.last = t.date;
      if (t.status === "booked" && t.date >= iso(today()) && (!c.next || t.date < c.next)) c.next = t.date;
      map.set(k, c);
    });
    return [...map.values()].sort((a, b) => b.spent - a.spent);
  }
  function viewCustomers() {
    const cs = customerList();
    if (custSel) {
      const c = cs.find(x => x.key === custSel);
      if (c) {
        return `<div class="card"><div class="card-head"><button class="btn small" type="button" data-cust="">‹ All customers</button></div>
          <h2>${esc(c.name)}</h2>
          <div class="insights" style="margin-top:8px">
            <div class="ins"><span class="k">Email</span><span class="v">${c.email ? `${esc(c.email)} ${mcp ? `<button class="btn small" type="button" data-compose-to="${esc(c.email)}" data-compose-name="${esc(c.name)}">Email</button>` : ""}<button class="btn small ghost" type="button" data-copy="${esc(c.email)}">Copy</button>` : "—"}</span></div>
            <div class="ins"><span class="k">Phone</span><span class="v">${c.phone ? `${esc(c.phone)} <button class="btn small ghost" type="button" data-copy="${esc(c.phone)}">Copy</button>` : "—"}</span></div>
            <div class="ins"><span class="k">Trips</span><span class="v">${c.trips.filter(t => t.status === "completed").length} completed${c.next ? ` · next ${fmtDate(c.next)}` : ""}</span></div>
            <div class="ins"><span class="k">Total spent</span><span class="v">${money(c.spent)}</span></div>
          </div>
          <h3 style="margin:14px 0 4px">Trip history</h3>
          <div class="list">${c.trips.slice().sort((a, b) => b.date.localeCompare(a.date)).map(tripRow).join("")}</div>
          <p class="note">Contact details come from the trips you log. Edit a trip to add or fix an email or phone number.</p></div>`;
      }
    }
    const repeat = cs.filter(c => c.trips.filter(t => t.status === "completed").length > 1).length;
    const lapsed = cs.filter(c => c.last && !c.next && daysUntil(c.last) < -300);
    return `<div class="card"><div class="card-head"><h2>Customers</h2><span class="note">${cs.length} total · ${repeat} repeat</span></div>
      ${cs.length ? `<div class="list">${cs.map(c => `<button class="row" type="button" data-cust="${esc(c.key)}" style="grid-template-columns:1fr auto"><span class="main"><span class="t1">${esc(c.name)}${c.trips.filter(t => t.status === "completed").length > 1 ? `<span class="pill ok">repeat</span>` : ""}${c.next ? `<span class="pill booked">booked</span>` : ""}</span><span class="t2">${c.trips.length} trip${c.trips.length === 1 ? "" : "s"}${c.last ? " · last " + fmtDate(c.last) : ""}${c.phone ? " · " + esc(c.phone) : ""}</span></span><span class="amt in">${money(c.spent)}</span></button>`).join("")}</div>`
        : `<div class="empty"><h3>No customers yet</h3><p>Customers are built from the names you add to trips.</p></div>`}</div>
      ${lapsed.length ? `<div class="card"><div class="card-head"><h2>Worth a hello</h2></div><p class="note" style="margin-top:0">These customers fished with you about a year ago and haven't booked again. A quick note before the season can bring them back.</p><div class="list">${lapsed.map(c => `<button class="row" type="button" data-cust="${esc(c.key)}" style="grid-template-columns:1fr auto"><span class="main"><span class="t1">${esc(c.name)}</span><span class="t2">Last trip ${fmtDate(c.last)}</span></span><span class="note">›</span></button>`).join("")}</div></div>` : ""}`;
  }

  // ---------- SETTINGS ----------
  function viewSettings() {
    const dis = canWrite ? "" : "disabled";
    return `<div class="card"><div class="card-head"><h2>Business settings</h2></div>
      <form id="setForm" class="fgrid">
        <div class="field full"><label for="s-name">Business or boat name</label><input id="s-name" name="name" value="${esc(settings.name)}" placeholder="e.g. Reel Time Charters" ${dis}></div>
        <div class="field"><label for="s-half">Half-day price ($)</label><input id="s-half" name="halfPrice" type="number" step="1" min="0" inputmode="decimal" value="${esc(settings.halfPrice)}" ${dis}></div>
        <div class="field"><label for="s-full">Full-day price ($)</label><input id="s-full" name="fullPrice" type="number" step="1" min="0" inputmode="decimal" value="${esc(settings.fullPrice)}" ${dis}></div>

        <div class="field"><label for="s-inc">Federal income tax rate (%)</label><input id="s-inc" name="incomeRate" type="number" step="1" min="0" max="40" inputmode="decimal" value="${esc(settings.incomeRate)}" ${dis}></div>
        <div class="field"><label for="s-state">State income tax rate (%)</label><input id="s-state" name="stateRate" type="number" step="0.1" min="0" max="15" inputmode="decimal" value="${esc(settings.stateRate)}" ${dis}></div>
        <div class="field"><label for="s-mile">Mileage rate ($/mile)</label><input id="s-mile" name="mileRate" type="number" step="0.005" min="0" inputmode="decimal" value="${esc(settings.mileRate)}" ${dis}></div>
        <div class="field" style="align-self:end">${canWrite ? `<button class="btn primary" type="submit">Save settings</button>` : ""}</div>
      </form>
      <p class="note">Prices fill in automatically when you log a trip. For the income tax rate, use your expected federal bracket (10%, 12%, 22%…). Check the IRS standard mileage rate each January and update it here. Florida, Texas and some other states have no state income tax, so leave that at 0 if yours doesn't.</p></div>
    <div class="card"><div class="card-head"><h2>Connected accounts</h2></div>
      <div class="insights">
        <div class="ins"><span class="k">Gmail</span><span class="v">${mail.state === "ok" ? "Connected" : mail.state === "error" ? esc(connMsg("Gmail", mail.code)) : mcp ? "Connecting…" : "Not available here"}</span></div>
        <div class="ins"><span class="k">Google Calendar</span><span class="v">${gcal.state === "ok" ? "Connected" : gcal.state === "error" ? esc(connMsg("Google Calendar", gcal.code)) : mcp ? "Connecting…" : "Not available here"}</span></div>
      </div>
      <p class="note" style="margin-bottom:0">The app reads your inbox and calendar through your claude.ai connectors. It only sends an email when you tap Send twice.</p></div>
    <div class="card"><div class="card-head"><h2>Export</h2></div>
      <p class="note" style="margin-top:0">Download everything as a spreadsheet (CSV) for your accountant or your own records.</p>
      <div class="add-row"><button class="btn" type="button" data-act="export">Download CSV</button></div></div>
    <div class="card"><div class="card-head"><h2>Expense categories</h2></div>
      <p class="note" style="margin-top:0"><b>Fixed</b> costs you pay whether or not you fish: ${EXP_CATS.filter(c => c.fixed).map(c => c.name).join(", ")}.</p>
      <p class="note"><b>Per-trip</b> costs go up the more you run: ${EXP_CATS.filter(c => !c.fixed).map(c => c.name).join(", ")}.</p>
      <p class="note" style="margin-bottom:0">Log your boat loan as two parts: interest is deductible, principal is not.</p></div>`;
  }

  // ================= forms =================
  const dlg = $("#dlg"), form = $("#dlgForm");
  const field = (id, label, input, cls = "") => `<div class="field ${cls}"><label for="${id}">${label}</label>${input}</div>`;
  const foot = (isNew, delKind, saveLabel) => `<p class="err" id="f-err" hidden></p><div class="dlg-foot">${!isNew && delKind ? `<button class="btn danger" type="button" data-del="${delKind}">Delete</button>` : ""}<div class="right"><button class="btn" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">${saveLabel}</button></div></div>`;
  const headH = t => `<div class="dlg-head"><h2>${t}</h2><button class="btn ghost small" type="button" data-act="close">Close</button></div>`;
  function openForm(kind, id, html) { form.dataset.kind = kind; form.dataset.id = id || ""; form.innerHTML = html; if (!dlg.open) dlg.showModal(); }

  function openTrip(t, preset) {
    const isNew = !t;
    t = t || Object.assign({ date: iso(today()), time: "07:00", type: "half", status: "completed", fee: settings.halfPrice, tips: "", deposit: "", party: "", hours: 4, pay: "Cash", customer: "", email: "", phone: "", notes: "" }, preset || {});
    openForm("trip", isNew ? "" : t.id, `${headH(isNew ? (preset?.status === "booked" ? "Add booking" : "Log a trip") : "Edit trip")}
      <div class="seg" role="group" aria-label="Trip type">${Object.entries(TRIP_TYPES).map(([k, l]) => `<button type="button" data-type="${k}" aria-pressed="${t.type === k}">${l}</button>`).join("")}</div>
      <div class="fgrid">
        ${field("f-date", "Date", `<input id="f-date" type="date" required value="${esc(t.date)}">`)}
        ${field("f-time", "Start time", `<input id="f-time" type="time" value="${esc(t.time || "")}">`)}
        ${field("f-status", "Status", `<select id="f-status">${["completed", "booked", "cancelled"].map(s => `<option value="${s}" ${t.status === s ? "selected" : ""}>${s[0].toUpperCase() + s.slice(1)}</option>`).join("")}</select>`)}
        ${field("f-fee", "Charter fee ($)", `<input id="f-fee" type="number" step="0.01" min="0" inputmode="decimal" value="${esc(t.fee)}">`)}
        ${field("f-tips", "Tips ($)", `<input id="f-tips" type="number" step="0.01" min="0" inputmode="decimal" value="${esc(t.tips)}" placeholder="0">`)}
        ${field("f-deposit", "Deposit received ($)", `<input id="f-deposit" type="number" step="0.01" min="0" inputmode="decimal" value="${esc(t.deposit)}" placeholder="0">`)}
        ${field("f-pay", "Paid by", `<select id="f-pay">${PAY.map(p => `<option ${t.pay === p ? "selected" : ""}>${p}</option>`).join("")}</select>`)}
        ${field("f-party", "Party size", `<input id="f-party" type="number" step="1" min="0" inputmode="numeric" value="${esc(t.party)}" placeholder="e.g. 4">`)}
        ${field("f-hours", "Hours on the water", `<input id="f-hours" type="number" step="0.5" min="0" inputmode="decimal" value="${esc(t.hours)}">`)}
        ${field("f-customer", "Customer", `<input id="f-customer" value="${esc(t.customer)}" placeholder="Name or group">`, "full")}
        ${field("f-email", "Customer email", `<input id="f-email" type="email" value="${esc(t.email || "")}" placeholder="optional">`)}
        ${field("f-phone", "Customer phone", `<input id="f-phone" type="tel" value="${esc(t.phone || "")}" placeholder="optional">`)}
        ${field("f-notes", "Notes", `<textarea id="f-notes" placeholder="Species, spot, conditions…">${esc(t.notes)}</textarea>`, "full")}
      </div>
      ${!isNew && mcp ? `<div class="add-row">${t.calEventId ? `<span class="note">On your Google Calendar.</span>` : `<button class="btn small" type="button" data-act="trip-to-cal">Add to Google Calendar</button>`}</div>` : ""}
      <p class="note" style="margin:0">Completed trips count the fee plus tips. Cancelled trips count only the deposit you kept. Booked trips show on Home and the calendar.</p>
      ${foot(isNew, "trip", isNew ? "Save trip" : "Save changes")}`);
    form.dataset.type = t.type; form.dataset.thread = t.emailThreadId || preset?.emailThreadId || "";
    form.querySelectorAll("[data-type]").forEach(b => b.onclick = () => {
      const prev = form.dataset.type; form.dataset.type = b.dataset.type;
      form.querySelectorAll("[data-type]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      const fee = $("#f-fee"), hrs = $("#f-hours");
      const defFee = { half: settings.halfPrice, full: settings.fullPrice }, defH = { half: 4, full: 8 };
      if (isNew && (fee.value === "" || +fee.value === +defFee[prev])) fee.value = defFee[b.dataset.type] ?? "";
      if (isNew && (hrs.value === "" || +hrs.value === defH[prev])) hrs.value = defH[b.dataset.type] ?? "";
    });
  }

  function openLedger(e, kind, presetCat) {
    const isNew = !e;
    e = e || { kind: kind || "expense", date: iso(today()), cat: presetCat || (kind === "income" ? "fishcleaning" : "fuel"), amount: "", vendor: "", gallons: "", notes: "" };
    const cats = e.kind === "income" ? INC_CATS : EXP_CATS;
    openForm("ledger", isNew ? "" : e.id, `${headH(isNew ? (e.kind === "income" ? "Log other income" : "Log an expense") : "Edit entry")}
      ${isNew ? `<div class="seg" role="group" aria-label="Entry kind"><button type="button" data-kind="expense" aria-pressed="${e.kind === "expense"}">Expense</button><button type="button" data-kind="income" aria-pressed="${e.kind === "income"}">Other income</button></div>` : ""}
      <div class="fgrid">
        ${field("l-date", "Date", `<input id="l-date" type="date" required value="${esc(e.date)}">`)}
        ${field("l-amount", "Amount ($)", `<input id="l-amount" type="number" step="0.01" min="0" inputmode="decimal" required value="${esc(e.amount)}" placeholder="0.00">`)}
        ${field("l-cat", "Category", `<select id="l-cat">${cats.map(c => `<option value="${c.id}" ${e.cat === c.id ? "selected" : ""}>${c.name}</option>`).join("")}</select>`, "full")}
        ${field("l-gallons", "Gallons (fuel only)", `<input id="l-gallons" type="number" step="0.1" min="0" inputmode="decimal" value="${esc(e.gallons)}" placeholder="e.g. 42">`)}
        ${field("l-vendor", e.kind === "income" ? "From" : "Vendor / paid to", `<input id="l-vendor" value="${esc(e.vendor)}" placeholder="${e.kind === "income" ? "Customer" : "e.g. Marina fuel dock"}">`)}
        ${field("l-notes", "Notes", `<textarea id="l-notes" placeholder="Policy number, part replaced, receipt #…">${esc(e.notes)}</textarea>`, "full")}
        ${e.kind === "expense" && assets ? field("l-receipt", "Receipt photo", `<input id="l-receipt" type="file" accept="image/*,application/pdf">${e.receiptUrl ? `<a href="${esc(e.receiptUrl)}" target="_blank" rel="noopener" class="note">View saved receipt</a>` : ""}`, "full") : ""}
      </div>
      ${foot(isNew, "ledger", isNew ? "Save" : "Save changes")}`);
    form.dataset.lkind = e.kind; form.dataset.receiptId = e.receiptId || ""; form.dataset.receiptUrl = e.receiptUrl || "";
    const syncGal = () => { const g = $("#l-gallons").closest(".field"); g.hidden = $("#l-cat").value !== "fuel"; };
    $("#l-cat").onchange = syncGal; syncGal();
    form.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => {
      const keep = { date: $("#l-date").value, amount: $("#l-amount").value, vendor: $("#l-vendor").value, notes: $("#l-notes").value };
      openLedger(null, b.dataset.kind);
      $("#l-date").value = keep.date; $("#l-amount").value = keep.amount; $("#l-vendor").value = keep.vendor; $("#l-notes").value = keep.notes;
    });
  }

  function openRenewal(r) {
    const isNew = !r; r = r || { name: "", due: "", notes: "" };
    openForm("renewal", isNew ? "" : r.id, `${headH(isNew ? "Add a renewal" : esc(r.name))}
      <div class="fgrid">
        ${field("r-name", "What", `<input id="r-name" value="${esc(r.name)}" placeholder="e.g. Captain's license">`, "full")}
        ${field("r-due", "Expires / due", `<input id="r-due" type="date" value="${esc(r.due)}">`)}
        ${field("r-notes", "Notes", `<input id="r-notes" value="${esc(r.notes)}" placeholder="License #, policy #…">`)}
      </div>${foot(isNew, "renewal", "Save")}`);
  }
  function openService(s) {
    const isNew = !s; s = s || { name: "", everyHours: "", everyMonths: "", lastHours: "", lastDate: "" };
    openForm("service", isNew ? "" : s.id, `${headH(isNew ? "Add a service item" : "Edit service item")}
      <div class="fgrid">
